server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: ms-pacientes
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mediturno_pacientes}
    username: ${SPRING_DATASOURCE_USERNAME:mediturno}
    password: ${SPRING_DATASOURCE_PASSWORD:mediturno}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger
  api-docs:
    path: /api-docs

logging:
  level:
    org.hibernate.SQL: warn
