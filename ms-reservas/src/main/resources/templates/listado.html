<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>MediTurno · Reservas</title>
    <link rel="stylesheet" th:href="@{/estilos.css}"/>
</head>
<body>
<header class="barra">
    <span class="marca">MediTurno 2.0</span>
    <nav>
        <a th:href="@{/}" data-testid="nav-reservas">Reservas</a>
        <a th:href="@{/pacientes}" data-testid="nav-pacientes">Pacientes</a>
        <a th:href="@{/reservas/nueva}" class="boton" data-testid="nav-nueva">Nueva reserva</a>
    </nav>
</header>

<main>
    <h1>Reservas</h1>

    <p class="mensaje exito" th:if="${exito}" th:text="${exito}" data-testid="mensaje-exito"></p>
    <p class="mensaje error" th:if="${error}" th:text="${error}" data-testid="mensaje-error"></p>

    <form method="get" th:action="@{/}" class="filtro">
        <label for="rut">RUT del paciente</label>
        <input type="text" id="rut" name="rut" th:value="${rut}"
               placeholder="12.345.678-9" data-testid="filtro-rut"/>
        <button type="submit" data-testid="filtro-buscar">Buscar</button>
    </form>

    <p class="dato-secundario" data-testid="hora-servicio">
        Hora del servicio: <span th:text="${ahora}"></span>
    </p>

    <table data-testid="tabla-reservas">
        <thead>
        <tr>
            <th scope="col">ID</th>
            <th scope="col">Paciente</th>
            <th scope="col">Especialidad</th>
            <th scope="col">Fecha y hora</th>
            <th scope="col">Canal</th>
            <th scope="col">Estado</th>
            <th scope="col">Copago</th>
            <th scope="col">Multa</th>
            <th scope="col">Detalle</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${reservas}" th:attr="data-testid='fila-reserva-' + ${r.id()}">
            <td th:text="${r.id()}" data-testid="celda-id"></td>
            <td th:text="${r.rutPaciente()}" data-testid="celda-rut"></td>
            <td th:text="${r.especialidad()}" data-testid="celda-especialidad"></td>
            <td th:text="${r.fechaHoraAtencion()}" data-testid="celda-fecha"></td>
            <td th:text="${r.canal()}" data-testid="celda-canal"></td>
            <td th:text="${r.estado()}" data-testid="celda-estado"></td>
            <td th:text="${r.copago()}" data-testid="celda-copago"></td>
            <td th:text="${r.multa()}" data-testid="celda-multa"></td>
            <td><a th:href="@{'/reservas/' + ${r.id()}}"
                   th:attr="data-testid='ver-' + ${r.id()}">Ver</a></td>
        </tr>
        <tr th:if="${#lists.isEmpty(reservas)}">
            <td colspan="9" data-testid="sin-resultados">No hay reservas para mostrar.</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
